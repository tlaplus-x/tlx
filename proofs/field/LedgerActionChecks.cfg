\* Action-check benchmark over the unchanged BookKeeper `LedgerChaining` module
\* (pinned `fe199dc717b5723f5308aca74eda6ab3b03917e5`): the upstream three
\* clients and all four upstream invariants, with the upstream `LedgerLimit`
\* predicate selected as an ACTION_CONSTRAINT instead of the upstream state
\* CONSTRAINT. This configuration is held fixed across both arms; only
\* `-optimize` differs. It is the Reviewer-supplied qualifying input: every
\* release run passes, and the measured A/B is 3,031,030/507,471 states at
\* ~11.4 s against 511,795/78,534 at ~3.3 s (3.46x median, one warmup and
\* three interleaved single-worker pairs).
CONSTANTS
    Clients = { c1, c2, c3 }
    WAITING = WAITING
    GET_MD_FOR_CLOSING = GET_MD_FOR_CLOSING
    CLOSE_LAST_LEDGER = CLOSE_LAST_LEDGER
    PENDING_CREATE_LEDGER = PENDING_CREATE_LEDGER
    PENDING_APPEND_LEDGER = PENDING_APPEND_LEDGER
    HAS_OPEN_LEDGER = HAS_OPEN_LEDGER

INIT Init
NEXT Next

INVARIANT
    TypeOK
    AllNonEmptyLedgersInLedgerList
    EntryOrderMaintained
    OnlyOneLedgerOpenAtATime

ACTION_CONSTRAINT
    LedgerLimit
