\* Two-client companion to `LedgerActionChecks.cfg` over the unchanged BookKeeper
\* `LedgerChaining` module at the pinned `fe199dc717b5723f5308aca74eda6ab3b03917e5`.
\* It keeps the upstream `TypeOK` invariant only and selects the upstream
\* `LedgerLimit` predicate as an ACTION_CONSTRAINT. The configuration is held
\* fixed across both arms. This case reproduces the slowdown the smaller graph
