name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_RELEASE_DEBUG: "0"
  CARGO_PROFILE_TEST_RELEASE_OPT_LEVEL: "1"
  RUST_BACKTRACE: "1"
  CC: clang
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  quality:
    name: Quality and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "quality-opt1"
      - name: Test dependencies
        run: |
          python3 -m pip install -r .github/requirements-ci.txt
          echo "TLX_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
          bash scripts/fetch-deps.sh --tests-only
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --release --all-targets --locked -- -D warnings
      - name: Build binary for Python tests and documentation examples
        run: cargo build --profile test-release -p tlx-cli --locked
      - name: Python driver tests
        run: |
          python3 -c '
          import concurrent.futures, os, pathlib, subprocess, sys
          tests = sorted(str(p) for p in pathlib.Path("scripts").rglob("test_*.py"))
          env = {**os.environ, "PYTHONPATH": "scripts" + (os.pathsep + os.environ["PYTHONPATH"] if os.environ.get("PYTHONPATH") else "")}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              futs = [(t, pool.submit(subprocess.run, [sys.executable, "-m", "unittest", t], capture_output=True, text=True, env=env)) for t in tests]
              failed = 0
              for t, fut in futs:
                  r = fut.result()
                  if r.returncode != 0:
                      failed += 1
                      print(f"FAIL {t} (exit {r.returncode})", file=sys.stderr)
                      if r.stdout:
                          print(r.stdout, file=sys.stderr)
                      if r.stderr:
                          print(r.stderr, file=sys.stderr)
          print(f"Ran {len(tests)} Python test modules ({failed} failed)")
          sys.exit(1 if failed else 0)
          '
      - name: Public source and documentation checks
        run: |
          python3 scripts/check_imports.py
          python3 scripts/knobs_check.py
          python3 scripts/dependency_check.py
          python3 scripts/doccheck.py --require-examples
          python3 scripts/bench.py suite-check
          python3 scripts/bench.py report --check

  lean:
    name: Lean 4 certificates (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "lean-opt1"
      - name: Cache Lean 4.34.1 toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/lean-4.34.1
          key: lean-4.34.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Lean 4.34.1
        run: |
          LEAN_DIR="$HOME/.local/share/lean-4.34.1"
          if [ ! -x "$LEAN_DIR/lean-4.34.1-linux/bin/lean" ]; then
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            curl -sSfL -o "$tmp/lean.tar.zst" \
              https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst
            echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $tmp/lean.tar.zst" | sha256sum -c -
            mkdir -p "$LEAN_DIR"
            tar --zstd -xf "$tmp/lean.tar.zst" -C "$LEAN_DIR"
          fi
          # Do not add Lean's bin/ to PATH: it bundles clang/ld.lld/llvm-ar,
          # which would shadow the system clang used by CC=clang in cargo builds.
          echo "LEAN_BIN=$LEAN_DIR/lean-4.34.1-linux/bin/lean" >> "$GITHUB_ENV"
          "$LEAN_DIR/lean-4.34.1-linux/bin/lean" --version
      - name: Build checker for certificate generation
        run: cargo build --profile test-release -p tlx-cli --locked
      - name: Lean 4 certificate and negative-mutation checks
        run: |
          python3 proofs/check_generated.py --lean "$LEAN_BIN" --negative --shard "${{ matrix.shard }}/4"
          if [ "${{ matrix.shard }}" = "1" ]; then
            "$LEAN_BIN" -t0 -DwarningAsError=true -R proofs/ordered proofs/ordered/HiddenAnchor.lean
          fi

  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            jobs: 4
          - os: ubuntu-24.04-arm
            jobs: 4
          - os: macos-15
            jobs: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      RUST_TEST_THREADS: ${{ matrix.jobs }}
      TLX_TLC_XMX: 2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "rust-test-opt1"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tlx-cache
          key: tlx-c-cache-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/tlx-compile/**', 'crates/tlx-native/**', 'crates/tlx-layout/**') }}
          restore-keys: tlx-c-cache-rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Test dependencies
        run: |
          echo "TLX_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
          bash scripts/fetch-deps.sh
      - name: Rust unit and integration tests
        env:
          TLX_CACHE: ${{ runner.temp }}/tlx-cache
        run: cargo test --workspace --profile test-release --locked --no-fail-fast

  spectest:
    name: Conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            jobs: 4
          - os: ubuntu-24.04-arm
            jobs: 4
          - os: macos-15
            jobs: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      TLX_TLC_XMX: 2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "spectest-opt1"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tlx-cache
          key: tlx-c-cache-spec-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/tlx-compile/**', 'crates/tlx-native/**', 'crates/tlx-layout/**') }}
          restore-keys: tlx-c-cache-spec-${{ runner.os }}-${{ runner.arch }}-
      - name: Test dependencies
        run: |
          echo "TLX_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
          bash scripts/fetch-deps.sh --tests-only
          mkdir -p target/ci
      - name: Build checker for conformance tests
        run: cargo build --profile test-release -p tlx-cli --locked
      - name: Interpreter conformance
        run: python3 scripts/spectest.py -j ${{ matrix.jobs }} --no-build --profile test-release --suite spectest --extra=-interp --results-json target/ci/interpreter.json
      - name: Compiled conformance
        env:
          TLX_CACHE: ${{ runner.temp }}/tlx-cache
        run: python3 scripts/spectest.py -j ${{ matrix.jobs }} --no-build --profile test-release --suite spectest-compile --extra=-compile --results-json target/ci/compiled.json
      - name: Paranoid compiled conformance
        env:
          TLX_PARANOID: "1"
          TLX_CACHE: ${{ runner.temp }}/tlx-cache
        run: python3 scripts/spectest.py -j ${{ matrix.jobs }} --no-build --profile test-release --suite spectest-paranoid --extra=-compile --results-json target/ci/paranoid.json
      # TLX_PARANOID implies TLX_NATIVE_SYNC, so the default tiering in the
      # step above builds and runs C and does not exercise the Cranelift JIT.
      # TLX_JIT=1 selects Cranelift codegen, whose results are cross-checked
      # against the interpreter.
      - name: JIT paranoid compiled conformance
        env:
          TLX_JIT: "1"
          TLX_PARANOID: "1"
        run: python3 scripts/spectest.py -j ${{ matrix.jobs }} --no-build --profile test-release --suite spectest-jit-paranoid --extra=-compile --results-json target/ci/jit-paranoid.json
      # Runs after Paranoid compiled conformance, which already built the C
      # libraries into the shared TLX_CACHE. TLX_NATIVE_SYNC loads them before
      # exploration (with TLX_JIT=0 a cached library would otherwise still be
      # loaded by the background builder, and short searches would finish on
      # the IR executor first); the pre-run reuse is disabled so the search
      # must execute C, and TLX_JIT=0 excludes the JIT.
      - name: C-only compiled conformance
        env:
          TLX_JIT: "0"
          TLX_PRERUN_REUSE: "0"
          TLX_NATIVE_SYNC: "1"
          TLX_CACHE: ${{ runner.temp }}/tlx-cache
        run: python3 scripts/spectest.py -j ${{ matrix.jobs }} --no-build --profile test-release --suite spectest-c --extra=-compile --results-json target/ci/c-only.json
      - name: Multi-worker compiled conformance
        env:
          TLX_CACHE: ${{ runner.temp }}/tlx-cache
        run: python3 scripts/spectest.py -j ${{ matrix.jobs }} --no-build --profile test-release --suite spectest-compile-w8 --extra="-compile -workers 8" --results-json target/ci/compiled-w8.json
      - name: Default-mode conformance
        env:
          TLX_CACHE: ${{ runner.temp }}/tlx-cache
          TLX_PROOF_DIR: ${{ runner.temp }}/tlx-proofs
        run: python3 scripts/spectest.py -j ${{ matrix.jobs }} --no-build --profile test-release --suite spectest-default --default-mode --results-json target/ci/default-mode.json
      - name: Retain conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.os }}
          path: target/ci/
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: CI
    if: always()
    needs: [quality, lean, rust-test, spectest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
          RUST_TEST_RESULT: ${{ needs.rust-test.result }}
          SPECTEST_RESULT: ${{ needs.spectest.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$LEAN_RESULT" = success
          test "$RUST_TEST_RESULT" = success
          test "$SPECTEST_RESULT" = success
      - name: Notify Multica on failure
        if: failure() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure')
        run: |
          curl -sS -X POST "${{ secrets.MULTICA_CI_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"repo":"${{ github.repository }}","run_id":"${{ github.run_id }}","ref":"${{ github.ref_name }}","sha":"${{ github.sha }}"}'
