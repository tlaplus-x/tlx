\* tlx corpus (ours): upstream Percolator/Test1.cfg without deadlock checking.
\* The model's terminal client states have no successors, so the default deadlock
\* check ends the search early; the state space of interest is the complete one.
\* See Percolator/Test1.tla.

CONSTANT
  c1 = c1
  c2 = c2
  c3 = c3
  KEY <- Key
  CLIENT <- Client
  CLIENT_PRIMARY_KEY <- ClientPrimaryKey

SYMMETRY
  Symmetry

SPECIFICATION
  PercolatorSpec

INVARIANT
  TypeInvariant
  WriteConsistency
  LockConsistency
  CommittedConsistency
  AbortedConsistency
  SnapshotIsolation

CHECK_DEADLOCK
  FALSE
