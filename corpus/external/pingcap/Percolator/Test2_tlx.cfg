\* See Percolator/Test2.tla.

CONSTANT
  c1 = c1
  c2 = c2
  KEY <- Key
  CLIENT <- Client
  CLIENT_PRIMARY_KEY <- ClientPrimaryKey

SPECIFICATION
  PercolatorSpec

INVARIANT
  TypeInvariant
  WriteConsistency
  LockConsistency
  CommittedConsistency
  AbortedConsistency
  SnapshotIsolation

CHECK_DEADLOCK
  FALSE
